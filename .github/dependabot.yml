version: 2

# Weekly, one grouped pull request per ecosystem. The labels matter: Dependabot
# drops labels that do not exist in the repository, and `skip-changeset` is what
# lets a dependency bump through the changeset gate. Create both once per repo:
#   gh label create dependencies && gh label create skip-changeset
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: ['dependencies', 'skip-changeset']
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-all:
        applies-to: version-updates
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # typescript-eslint and the Astro checker lag a TypeScript major.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    labels: ['dependencies', 'skip-changeset']
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-all:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
