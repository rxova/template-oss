name: Docs

# Publishes apps/docs to GitHub Pages on every push to main. Skipped on the
# template itself, and until Settings → Pages → Source is GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/*/src/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Queued, never cancelled: this run is the publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    name: Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: rxova/shared/.github/workflows/pages-deploy.yml@main
