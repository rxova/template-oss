name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * 6'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# An analysis is a property of a commit, and only the newest commit on a ref can
# still be merged, so superseded runs are cancelled. Per ref, so two branches
# under review do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'actions']
    steps:
      # Whether code scanning accepts an upload at all. Where Code Security is
      # not enabled (a private repository without it, or this template before a
      # project goes public), `analyze` goes red after minutes of analysis for a
      # reason unrelated to the code. This asks the code-scanning API directly
      # rather than inferring from visibility, which is only a proxy for the
      # setting that decides. Unknown errors fall through to running CodeQL: a
      # probe that cannot reach a verdict should not silence a security scan.
      - name: Is code scanning available here
        id: scanning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if error=$(gh api "repos/$GITHUB_REPOSITORY/code-scanning/alerts?per_page=1" 2>&1 >/dev/null); then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$error" in
            *'must be enabled'*|*'Advanced Security'*|*'Code Security'*)
              echo "::notice::Skipping CodeQL: code scanning is not enabled for this repository."
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::warning::Could not tell whether code scanning is enabled, so running anyway: $error"
              echo 'enabled=true' >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Checkout
        if: steps.scanning.outputs.enabled == 'true'
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        if: steps.scanning.outputs.enabled == 'true'
        uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        if: steps.scanning.outputs.enabled == 'true'
        uses: github/codeql-action/analyze@v4.38.0
